name: Build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Caches Gradle downloads and build outputs between runs (big speed-up).
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # The app has flavors (universal / gms), so a plain "assembleDebug" builds every
      # variant and puts the APK in a flavor sub-folder. Build only the one we ship.
      - name: Build debug APK
        run: bash scripts/build.sh :app:assembleUniversalGmsDebug

      # Upload right after the build so you still get an APK even if tests or lint fail.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: microcord-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        run: bash scripts/build.sh :app:testUniversalGmsDebugUnitTest

      - name: Check for APIs newer than minSdk
        run: bash scripts/build.sh :app:lintUniversalGmsDebug :plugin-api:lintDebug
